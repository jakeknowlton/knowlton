[project]
name = "knowlton"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "black>=26.5.1",
    "fastapi[standard]>=0.138.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlmodel>=0.0.38",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.8",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.basedpyright]
# `standard` matches upstream pyright's default: it catches real type errors
# (missing/None-typed args, bad calls) without basedpyright's much stricter
# `recommended` extras (reportAny, reportUnknownMemberType, missing library
# stubs), which are noise against FastAPI/SQLModel's dynamic internals.
typeCheckingMode = "standard"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["auth", "food", "home", "scripts", "tests", "config.py", "database.py", "main.py"]
